# TV remote -> keys Steam's Big Picture understands. Scancodes are CEC
# User Control codes. The kernel's default rc-cec map sends KEY_OK and
# KEY_EXIT for Select and Back, which Steam ignores.
[[protocols]]
name = "cec-steam"
protocol = "cec"

[protocols.scancodes]
0x00 = "KEY_ENTER"        # Select
0x01 = "KEY_UP"
0x02 = "KEY_DOWN"
0x03 = "KEY_LEFT"
0x04 = "KEY_RIGHT"
0x09 = "KEY_HOMEPAGE"     # Root Menu (Home)
0x0b = "KEY_MENU"         # Contents
0x0d = "KEY_ESC"          # Exit (Back on most remotes)
0x91 = "KEY_ESC"          # Return (CEC 2.0 Back)
0x20 = "KEY_0"
0x21 = "KEY_1"
0x22 = "KEY_2"
0x23 = "KEY_3"
0x24 = "KEY_4"
0x25 = "KEY_5"
0x26 = "KEY_6"
0x27 = "KEY_7"
0x28 = "KEY_8"
0x29 = "KEY_9"
0x44 = "KEY_PLAYCD"       # Play
0x45 = "KEY_STOPCD"       # Stop
0x46 = "KEY_PAUSECD"      # Pause
0x48 = "KEY_REWIND"
0x49 = "KEY_FASTFORWARD"
0x4b = "KEY_NEXTSONG"     # Forward
0x4c = "KEY_PREVIOUSSONG" # Backward
