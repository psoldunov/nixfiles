#:schema https://www.ensemblr.dev/schemas/settings.schema.json

# Every command targets this worktree's flake (`.#...`), never ~/.nixfiles.
# rebuild_system/update_system hardcode ~/.nixfiles and `git add -A` + commit
# there, so the switch/update scripts below reimplement them against the
# worktree and leave staging and committing to the workspace.

[scripts]
# Fetch every locked flake input into the store (no-op when already cached).
setup = "nix flake archive"

[scripts.run.check]
command = "nix flake check --no-build"
icon = "shield-check"
default = true

[scripts.run.lint]
command = "nix fmt -- --check flake.nix lib hosts modules overlays packages"
icon = "list-checks"

[scripts.run.format]
command = "nix fmt -- flake.nix lib hosts modules overlays packages"
icon = "paintbrush"

[scripts.run.build-whopper]
command = "nix build .#nixosConfigurations.Whopper.config.system.build.toplevel --no-link --print-out-paths && nix store diff-closures /run/current-system .#nixosConfigurations.Whopper.config.system.build.toplevel"
icon = "hammer"

# Evaluation only: Whopper cannot build aarch64-darwin, so this is how a
# Mac change gets checked here before it reaches the Mac.
[scripts.run.eval-macs]
command = "nix eval --raw .#darwinConfigurations.BigMac.system.drvPath && echo && nix eval --raw .#darwinConfigurations.MacFlurry.system.drvPath"
icon = "search"

# The HTPC has no current system on Whopper to diff against, so this only
# builds it.
[scripts.run.build-shackstack]
command = "nix build .#nixosConfigurations.ShackStack.config.system.build.toplevel --no-link --print-out-paths"
icon = "hammer"

[scripts.run.eval-pihome]
command = "nix eval --raw .#nixosConfigurations.PiHome.config.system.build.toplevel.drvPath"
icon = "search"

[scripts.run.build-pihome-image]
command = "nix build .#nixosConfigurations.PiHome.config.system.build.sdImage --out-link result-pihome-image --print-out-paths"
icon = "hard-drive"

[scripts.run.test-adguard-cli]
command = "nix build .#checks.x86_64-linux.adguard-cli --no-link"
icon = "test-tube"

# rebuild-* mirror `rebuild_system [host|all]`: switch to this worktree's flake.
# scripts/switch-host.sh picks the route from the host running it, so they
# work from Whopper and from the Macs, which have no nixos-rebuild: a Mac
# copies the flake into the target's store and the target builds and
# activates it over ssh, where sudo asks for the target's password once.
# The Macs and ShackStack (the HTPC) are often asleep or away. The
# -all scripts run them last with --if-online, which skips a host that does
# not answer instead of failing the run. They run one host at a time, so
# PiHome, which every host resolves names through, never restarts its DNS
# while another host is building.
[scripts.run.rebuild-pihome]
command = "scripts/switch-host.sh PiHome"
icon = "network"

[scripts.run.rebuild-whopper]
command = "scripts/switch-host.sh Whopper"
icon = "rocket"

[scripts.run.rebuild-bigtasty]
command = "scripts/switch-host.sh BigTasty"
icon = "server"

[scripts.run.rebuild-bigking]
command = "scripts/switch-host.sh BigKing"
icon = "hard-drive"

[scripts.run.rebuild-shackstack]
command = "scripts/switch-host.sh ShackStack"
icon = "gamepad-2"

[scripts.run.rebuild-bigmac]
command = "scripts/switch-host.sh BigMac"
icon = "monitor"

[scripts.run.rebuild-macflurry]
command = "scripts/switch-host.sh MacFlurry"
icon = "laptop"

[scripts.run.rebuild-all]
command = '''scripts/switch-host.sh Whopper && scripts/switch-host.sh BigTasty && scripts/switch-host.sh BigKing && scripts/switch-host.sh PiHome && scripts/switch-host.sh ShackStack --if-online && scripts/switch-host.sh BigMac --if-online && scripts/switch-host.sh MacFlurry --if-online'''
icon = "layers"

# One-time: the first nix-darwin switch on a Mac. Needs upstream Nix on the
# Mac first; see the header of scripts/bootstrap-mac.sh.
[scripts.run.bootstrap-macflurry]
command = "scripts/bootstrap-mac.sh MacFlurry"
icon = "rocket"

# Bump flake.lock only, so the input changes can be reviewed before a rebuild.
[scripts.run.update-lock]
command = "nix flake update"
icon = "refresh-cw"

# update-* mirror `update_system [host|all]`: bump flake.lock, then switch.
[scripts.run.update-whopper]
command = "nix flake update && scripts/switch-host.sh Whopper"
icon = "download"

[scripts.run.update-bigtasty]
command = "nix flake update && scripts/switch-host.sh BigTasty"
icon = "cloud"

[scripts.run.update-bigking]
command = "nix flake update && scripts/switch-host.sh BigKing"
icon = "database"

[scripts.run.update-shackstack]
command = "nix flake update && scripts/switch-host.sh ShackStack"
icon = "gamepad"

[scripts.run.update-pihome]
command = "nix flake update && scripts/switch-host.sh PiHome"
icon = "network"

[scripts.run.update-bigmac]
command = "nix flake update && scripts/switch-host.sh BigMac --update"
icon = "upload"

[scripts.run.update-macflurry]
command = "nix flake update && scripts/switch-host.sh MacFlurry --update"
icon = "upload"

[scripts.run.update-all]
command = '''nix flake update && scripts/switch-host.sh Whopper && scripts/switch-host.sh BigTasty && scripts/switch-host.sh BigKing && scripts/switch-host.sh PiHome && scripts/switch-host.sh ShackStack --if-online && scripts/switch-host.sh BigMac --update --if-online && scripts/switch-host.sh MacFlurry --update --if-online'''
icon = "zap"
